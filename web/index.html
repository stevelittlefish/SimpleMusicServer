<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Music Server</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<main>
<header><div><p class="eyebrow">LOCAL LISTENING</p><h1>Simple Music Server</h1></div><button id="refresh">Refresh library</button></header>
<section class="player" aria-label="Music player">
<p class="eyebrow" id="position">NOW PLAYING</p><h2 id="title">Your music, right here.</h2>
<div class="wave-wrap"><canvas id="wave" aria-hidden="true"></canvas><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek through track" disabled></div>
<div class="time"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
<div class="controls"><button id="previous" aria-label="Previous track" disabled>⏮</button><button id="play" disabled>Play</button><button id="next" aria-label="Next track" disabled>⏭</button><label class="volume">Volume <input id="volume" type="range" min="0" max="1" step="0.01" value="1"></label></div>
<p id="status" role="status">Loading library…</p>
<p id="wave-status" role="status"></p>
<audio id="audio" preload="auto"></audio>
</section>
<section class="library" aria-label="Playlist"><div class="library-heading"><h2>Playlist</h2><span id="count">0 tracks</span></div><ol id="tracks"></ol><p id="empty" hidden>Drop WAV, OGG, MP3, FLAC or Opus files into <code>data/</code>, then refresh the library.</p></section>
</main>
</body>
</html>
